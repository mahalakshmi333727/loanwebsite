<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164B68"/>
      <stop offset="100%" stop-color="#0E2D40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C170"/>
      <stop offset="100%" stop-color="#B88A2E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="700" cy="80" r="240" fill="url(#goldGrad)" opacity="0.08"/>
  <circle cx="100" cy="420" r="180" fill="url(#goldGrad)" opacity="0.05"/>
  
  <!-- Decorative Grid lines -->
  <path d="M 0,250 Q 200,180 400,250 T 800,250" fill="none" stroke="rgba(229,193,112,0.15)" stroke-width="2"/>
  <path d="M 0,300 Q 200,230 400,300 T 800,300" fill="none" stroke="rgba(229,193,112,0.1)" stroke-width="1.5"/>
  
  <!-- Central Graphic Shield & Sun / Golden Years Concept -->
  <g transform="translate(400, 210)">
    <circle cx="0" cy="0" r="90" fill="rgba(229,193,112,0.15)" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="75" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Senior Couple Icon Symbol -->
    <path d="M -30,15 C -30,-5 -15,-20 0,-20 C 15,-20 30,-5 30,15 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-12" cy="-32" r="10" fill="url(#goldGrad)"/>
    <circle cx="12" cy="-32" r="10" fill="url(#goldGrad)"/>
    <!-- Umbrella / Security Roof -->
    <path d="M -50,-48 Q 0,-70 50,-48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0,-60 L 0,-48" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  
  <!-- Typography Badge -->
  <rect x="220" y="350" width="360" height="54" rx="27" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="400" y="384" font-family="'Cinzel', 'Courier Prime', Georgia, serif" font-size="20" font-weight="700" fill="#E5C170" text-anchor="middle" letter-spacing="2">RETIREMENT PLANNING</text>
  <text x="400" y="435" font-family="sans-serif" font-size="14" fill="#C5D3E0" text-anchor="middle" letter-spacing="1">Securing Your Peaceful Golden Years</text>
</svg>
